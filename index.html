<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Car Jam – Traffic Puzzle</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0f0f1a;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px 10px;
    color: #fff;
    user-select: none;
  }
  h1 {
    font-size: 1.9rem;
    font-weight: 900;
    letter-spacing: 4px;
    color: #fff;
    text-shadow: 0 0 30px rgba(255,255,255,0.2);
    margin-bottom: 2px;
  }
  .subtitle { font-size: 0.7rem; color: #555; letter-spacing: 3px; margin-bottom: 14px; }

  #hud {
    display: flex;
    gap: 20px;
    margin-bottom: 14px;
    background: #1a1a2e;
    border-radius: 12px;
    padding: 8px 24px;
    border: 1px solid #2a2a40;
  }
  .hud-item { text-align: center; }
  .hud-label { font-size: 0.6rem; color: #555; letter-spacing: 2px; text-transform: uppercase; }
  .hud-val { font-size: 1.3rem; font-weight: 700; }
  #val-level { color: #a78bfa; }
  #val-moves { color: #fbbf24; }
  #val-solved { color: #34d399; }

  /* Legend */
  #legend {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .leg-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    color: #aaa;
    background: #1a1a2e;
    border-radius: 8px;
    padding: 4px 10px;
    border: 1px solid #2a2a40;
  }
  .leg-dot { width: 12px; height: 12px; border-radius: 3px; }

  /* Board wrapper — holds canvas + exit arrows */
  #board-wrap {
    position: relative;
    display: inline-block;
  }

  /* Exit arrows positioned around the board */
  .exit-marker {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    font-weight: 900;
    pointer-events: none;
    border-radius: 6px;
    padding: 2px 4px;
    transition: opacity 0.3s;
  }

  canvas {
    display: block;
    border-radius: 14px;
    cursor: grab;
    touch-action: none;
  }
  canvas:active { cursor: grabbing; }

  #controls {
    margin-top: 12px;
    display: flex;
    gap: 10px;
  }
  .ctrl-btn {
    background: #1a1a2e;
    color: #888;
    border: 1px solid #2a2a40;
    border-radius: 8px;
    padding: 7px 18px;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .ctrl-btn:hover { border-color: #a78bfa; color: #a78bfa; }

  #tip { margin-top: 8px; font-size: 0.72rem; color: #333; letter-spacing: 1px; text-align:center; }

  /* Overlay */
  #msg-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  #msg-overlay.show { opacity:1; pointer-events:all; }
  .msg-box {
    background: #1a1a2e;
    border: 2px solid #a78bfa;
    border-radius: 20px;
    padding: 36px 48px;
    text-align: center;
    box-shadow: 0 0 60px rgba(167,139,250,0.3);
  }
  .msg-box h2 { font-size: 2rem; margin-bottom: 6px; color: #a78bfa; }
  .msg-box p  { color: #888; margin-bottom: 22px; }
  .btn {
    background: #a78bfa;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px 32px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.1s;
    box-shadow: 0 4px 20px rgba(167,139,250,0.4);
  }
  .btn:hover { transform: translateY(-2px); }
</style>
</head>
<body>

<h1>🚗 CAR JAM</h1>
<p class="subtitle">COLOR EXIT PUZZLE</p>

<div id="hud">
  <div class="hud-item">
    <div class="hud-label">Level</div>
    <div class="hud-val" id="val-level">1</div>
  </div>
  <div class="hud-item">
    <div class="hud-label">Moves</div>
    <div class="hud-val" id="val-moves">0</div>
  </div>
  <div class="hud-item">
    <div class="hud-label">Escaped</div>
    <div class="hud-val" id="val-solved">0/0</div>
  </div>
</div>

<div id="legend"></div>

<div id="board-wrap">
  <canvas id="c"></canvas>
  <!-- exit markers injected by JS -->
</div>

<div id="controls">
  <button class="ctrl-btn" onclick="resetLevel()">↺ Restart</button>
  <button class="ctrl-btn" onclick="skipLevel()">Skip ›</button>
</div>
<p id="tip">Drag each car to its matching colored exit ➤</p>

<div id="msg-overlay">
  <div class="msg-box">
    <h2 id="msg-title">🎉 Level Clear!</h2>
    <p id="msg-body">All cars escaped!</p>
    <button class="btn" id="msg-btn" onclick="onMsgBtn()">Next Level</button>
  </div>
</div>

<script>
// --- Constants ---
const GRID  = 6;
const CELL  = 76;
const GAP   = 5;
const PAD   = 14;
const SIZE  = GRID * CELL + (GRID + 1) * GAP + PAD * 2;
const RAD   = 9;

// Exit sides: R=right, L=left, U=up, D=down
// For H cars: R or L.  For V cars: U or D.
// Exit position on board edge:
//   R → right edge, at car's row
//   L → left edge, at car's row
//   U → top edge, at car's col
//   D → bottom edge, at car's col

// --- Level Definitions ---
// Format: { cars: [...] }
// car: { id, color, hexColor, row, col, len, dir:'H'|'V', exit:'R'|'L'|'U'|'D' }
const LEVELS = [
  // Level 1 - easy start, 3 cars
  { cars: [
    { id:0, color:'red',   hex:'#ef4444', row:2, col:0, len:2, dir:'H', exit:'R' },
    { id:1, color:'blue',  hex:'#3b82f6', row:0, col:3, len:2, dir:'V', exit:'U' },
    { id:2, color:'green', hex:'#22c55e', row:3, col:2, len:2, dir:'V', exit:'D' },
  ]},
  // Level 2 - 3 cars
  { cars: [
    { id:0, color:'red',   hex:'#ef4444', row:2, col:0, len:2, dir:'H', exit:'R' },
    { id:1, color:'blue',  hex:'#3b82f6', row:1, col:2, len:2, dir:'V', exit:'U' },
    { id:2, color:'green', hex:'#22c55e', row:2, col:4, len:2, dir:'V', exit:'D' },
  ]},
  // Level 3 - 3 cars, a bit harder
  { cars: [
    { id:0, color:'red',   hex:'#ef4444', row:2, col:0, len:2, dir:'H', exit:'R' },
    { id:1, color:'blue',  hex:'#3b82f6', row:0, col:2, len:3, dir:'V', exit:'U' },
    { id:2, color:'green', hex:'#22c55e', row:2, col:4, len:2, dir:'V', exit:'D' },
  ]},
  // Level 4 - added yellow car
  { cars: [
    { id:0, color:'red',    hex:'#ef4444', row:2, col:1, len:2, dir:'H', exit:'R' },
    { id:1, color:'blue',   hex:'#3b82f6', row:0, col:4, len:2, dir:'V', exit:'U' },
    { id:2, color:'green',  hex:'#22c55e', row:3, col:2, len:2, dir:'V', exit:'D' },
    { id:3, color:'yellow', hex:'#facc15', row:4, col:0, len:2, dir:'H', exit:'L' },
  ]},
  // Level 5 - 4 cars
  { cars: [
    { id:0, color:'red',    hex:'#ef4444', row:2, col:0, len:2, dir:'H', exit:'R' },
    { id:1, color:'blue',   hex:'#3b82f6', row:0, col:2, len:2, dir:'V', exit:'U' },
    { id:2, color:'green',  hex:'#22c55e', row:3, col:4, len:2, dir:'V', exit:'D' },
    { id:3, color:'yellow', hex:'#facc15', row:4, col:2, len:2, dir:'H', exit:'L' },
  ]},
  // Level 6 - 4 cars
  { cars: [
    { id:0, color:'red',    hex:'#ef4444', row:2, col:2, len:2, dir:'H', exit:'R' },
    { id:1, color:'blue',   hex:'#3b82f6', row:1, col:0, len:2, dir:'V', exit:'U' },
    { id:2, color:'green',  hex:'#22c55e', row:2, col:4, len:2, dir:'V', exit:'D' },
    { id:3, color:'yellow', hex:'#facc15', row:3, col:1, len:2, dir:'H', exit:'L' },
  ]},
  // Level 7: 5 cars, added purple
  { cars: [
    { id:0, color:'red',    hex:'#ef4444', row:2, col:3, len:2, dir:'H', exit:'R' },
    { id:1, color:'blue',   hex:'#3b82f6', row:4, col:4, len:2, dir:'V', exit:'U' },
    { id:2, color:'green',  hex:'#22c55e', row:1, col:2, len:2, dir:'V', exit:'D' },
    { id:3, color:'yellow', hex:'#facc15', row:1, col:4, len:2, dir:'H', exit:'L' },
    { id:4, color:'purple', hex:'#a855f7', row:0, col:0, len:2, dir:'V', exit:'D' },
  ]},
  // Level 8: 5 cars
  { cars: [
    { id:0, color:'red',    hex:'#ef4444', row:2, col:1, len:2, dir:'H', exit:'R' },
    { id:1, color:'blue',   hex:'#3b82f6', row:0, col:0, len:2, dir:'V', exit:'U' },
    { id:2, color:'green',  hex:'#22c55e', row:3, col:4, len:2, dir:'V', exit:'D' },
    { id:3, color:'yellow', hex:'#facc15', row:4, col:2, len:2, dir:'H', exit:'L' },
    { id:4, color:'purple', hex:'#a855f7', row:0, col:5, len:2, dir:'V', exit:'D' },
  ]},
  // Level 9: 6 cars, added pink
  { cars: [
    { id:0, color:'red',    hex:'#ef4444', row:2, col:0, len:2, dir:'H', exit:'R' },
    { id:1, color:'blue',   hex:'#3b82f6', row:0, col:2, len:2, dir:'V', exit:'U' },
    { id:2, color:'green',  hex:'#22c55e', row:3, col:3, len:2, dir:'V', exit:'D' },
    { id:3, color:'yellow', hex:'#facc15', row:5, col:1, len:2, dir:'H', exit:'L' },
    { id:4, color:'purple', hex:'#a855f7', row:1, col:5, len:3, dir:'V', exit:'D' },
    { id:5, color:'pink',   hex:'#ec4899', row:0, col:0, len:2, dir:'H', exit:'L' },
  ]},
  // Level 10: 6 cars
  { cars: [
    { id:0, color:'red',    hex:'#ef4444', row:2, col:0, len:2, dir:'H', exit:'R' },
    { id:1, color:'blue',   hex:'#3b82f6', row:1, col:4, len:2, dir:'V', exit:'U' },
    { id:2, color:'green',  hex:'#22c55e', row:2, col:5, len:2, dir:'V', exit:'D' },
    { id:3, color:'yellow', hex:'#facc15', row:0, col:1, len:2, dir:'H', exit:'L' },
    { id:4, color:'purple', hex:'#a855f7', row:3, col:4, len:2, dir:'V', exit:'D' },
    { id:5, color:'pink',   hex:'#ec4899', row:3, col:1, len:2, dir:'H', exit:'L' },
  ]},
];

// --- Game State ---
let levelIdx = 0;
let cars = [];        // live car objects (with escaped flag)
let moves = 0;
let dragging = null;
// Win animation
let escapingCar = null;  // car currently animating off screen
let escapeProgress = 0;
let escapeCallback = null;

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
canvas.width  = SIZE;
canvas.height = SIZE;

// --- Helper Functions ---
const c2p = g => PAD + GAP + g * (CELL + GAP);
const p2c = p => (p - PAD - GAP) / (CELL + GAP);

function cloneLevel(idx) {
  return LEVELS[idx % LEVELS.length].cars.map(c => ({...c, escaped: false}));
}

function occupies(car, r, col) {
  if (car.escaped) return false;
  return car.dir === 'H'
    ? r === car.row && col >= car.col && col < car.col + car.len
    : col === car.col && r >= car.row && r < car.row + car.len;
}

function buildGrid(skipId = -1) {
  const g = Array.from({length:GRID}, () => new Int8Array(GRID).fill(-1));
  for (const car of cars) {
    if (car.id === skipId || car.escaped) continue;
    for (let i = 0; i < car.len; i++) {
      const r = car.dir === 'V' ? car.row + i : car.row;
      const c = car.dir === 'H' ? car.col + i : car.col;
      if (r >= 0 && r < GRID && c >= 0 && c < GRID) g[r][c] = car.id;
    }
  }
  return g;
}

function slideMax(car, target) {
  const g = buildGrid(car.id);
  const step = target > (car.dir === 'H' ? car.col : car.row) ? 1 : -1;
  let pos = car.dir === 'H' ? car.col : car.row;
  while (pos !== target) {
    const np = pos + step;
    // bounds
    if (car.dir === 'H' && (np < 0 || np + car.len > GRID)) break;
    if (car.dir === 'V' && (np < 0 || np + car.len > GRID)) break;
    // collision
    let blocked = false;
    for (let k = 0; k < car.len; k++) {
      const r = car.dir === 'V' ? np + k : car.row;
      const c = car.dir === 'H' ? np + k : car.col;
      if (g[r][c] !== -1) { blocked = true; break; }
    }
    if (blocked) break;
    pos = np;
  }
  return pos;
}

// --- Exit Markers ---
function buildExitMarkers() {
  // Remove old
  document.querySelectorAll('.exit-marker').forEach(e => e.remove());
  const wrap = document.getElementById('board-wrap');
  const lvl  = LEVELS[levelIdx % LEVELS.length];

  for (const car of lvl.cars) {
    const m = document.createElement('div');
    m.className = 'exit-marker';
    m.id = `exit-${car.id}`;
    m.style.color = car.hex;
    m.style.background = car.hex + '22';
    m.style.border = `2px solid ${car.hex}55`;

    const MARKER = 28;
    if (car.exit === 'R') {
      const y = c2p(car.row) + CELL / 2 - MARKER / 2;
      m.style.cssText += `right:-${MARKER+4}px; top:${y}px; width:${MARKER}px; height:${MARKER}px;`;
      m.textContent = '▶';
    } else if (car.exit === 'L') {
      const y = c2p(car.row) + CELL / 2 - MARKER / 2;
      m.style.cssText += `left:-${MARKER+4}px; top:${y}px; width:${MARKER}px; height:${MARKER}px;`;
      m.textContent = '◀';
    } else if (car.exit === 'U') {
      const x = c2p(car.col) + CELL / 2 - MARKER / 2;
      m.style.cssText += `top:-${MARKER+4}px; left:${x}px; width:${MARKER}px; height:${MARKER}px;`;
      m.textContent = '▲';
    } else { // D
      const x = c2p(car.col) + CELL / 2 - MARKER / 2;
      m.style.cssText += `bottom:-${MARKER+4}px; left:${x}px; width:${MARKER}px; height:${MARKER}px;`;
      m.textContent = '▼';
    }
    wrap.appendChild(m);
  }
}

// --- Legend ---
function buildLegend() {
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  const lvl = LEVELS[levelIdx % LEVELS.length];
  const exitLabel = { R:'→ Right', L:'← Left', U:'↑ Top', D:'↓ Bottom' };
  for (const car of lvl.cars) {
    const item = document.createElement('div');
    item.className = 'leg-item';
    item.innerHTML = `<div class="leg-dot" style="background:${car.hex}"></div>${car.color[0].toUpperCase()+car.color.slice(1)}: ${exitLabel[car.exit]}`;
    legend.appendChild(item);
  }
}

// --- Load Level ---
function loadLevel(idx) {
  levelIdx = idx;
  cars = cloneLevel(idx);
  moves = 0;
  dragging = null;
  escapingCar = null;
  updateHUD();
  buildExitMarkers();
  buildLegend();
}

function updateHUD() {
  document.getElementById('val-level').textContent = (levelIdx % LEVELS.length) + 1;
  document.getElementById('val-moves').textContent = moves;
  const escaped = cars.filter(c => c.escaped).length;
  document.getElementById('val-solved').textContent = `${escaped}/${cars.length}`;
}

// --- Drawing Functions ---
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function drawCarAt(car, extraX, extraY) {
  const cw = car.dir === 'H' ? car.len * CELL + (car.len-1)*GAP : CELL;
  const ch = car.dir === 'V' ? car.len * CELL + (car.len-1)*GAP : CELL;
  const x  = c2p(car.col) + (extraX||0);
  const y  = c2p(car.row) + (extraY||0);
  const p  = 5;

  // Shadow
  ctx.save();
  ctx.shadowColor = car.hex;
  ctx.shadowBlur = 14;
  ctx.fillStyle = car.hex;
  rr(x+p, y+p, cw-p*2, ch-p*2, RAD-2); ctx.fill();
  ctx.restore();

  // Body
  ctx.fillStyle = car.hex;
  rr(x+p, y+p, cw-p*2, ch-p*2, RAD-2); ctx.fill();

  // Shine
  const shine = ctx.createLinearGradient(x+p, y+p, x+p, y+p+(ch-p*2)*0.55);
  shine.addColorStop(0, 'rgba(255,255,255,0.45)');
  shine.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = shine;
  rr(x+p, y+p, cw-p*2, ch-p*2, RAD-2); ctx.fill();

  // Windows
  ctx.fillStyle = 'rgba(10,15,30,0.78)';
  const wp = 10;
  if (car.dir === 'H') {
    const ww = (cw - p*2 - wp*3) / 2;
    const wh = ch - p*2 - wp*2;
    if (ww > 2) { rr(x+p+wp, y+p+wp, ww, wh, 4); ctx.fill(); }
    if (ww > 2) { rr(x+p+wp*2+ww, y+p+wp, ww, wh, 4); ctx.fill(); }
  } else {
    const ww = cw - p*2 - wp*2;
    const wh = (ch - p*2 - wp*3) / 2;
    if (wh > 2) { rr(x+p+wp, y+p+wp, ww, wh, 4); ctx.fill(); }
    if (wh > 2) { rr(x+p+wp, y+p+wp*2+wh, ww, wh, 4); ctx.fill(); }
  }

  // Wheels
  const wr = 5;
  const wps = car.dir === 'H'
    ? [[p+4,p+2],[cw-p-8,p+2],[p+4,ch-p-6],[cw-p-8,ch-p-6]]
    : [[p+2,p+4],[p+2,ch-p-8],[cw-p-6,p+4],[cw-p-6,ch-p-8]];
  for (const [dx,dy] of wps) {
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x+dx, y+dy, wr, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#444'; ctx.beginPath(); ctx.arc(x+dx, y+dy, 2.5, 0, Math.PI*2); ctx.fill();
  }
}

// Draw exit lane glow on board
function drawExitGlow(car) {
  if (car.escaped) return;
  const alpha = 0.10;
  ctx.fillStyle = car.hex + Math.round(alpha*255).toString(16).padStart(2,'0');
  if (car.exit === 'R') {
    // highlight the row from car's right edge to board right
    const x1 = c2p(car.col + car.len);
    const y  = c2p(car.row);
    ctx.fillRect(x1, y, SIZE - PAD - x1, CELL);
  } else if (car.exit === 'L') {
    const x2 = c2p(car.col);
    const y  = c2p(car.row);
    ctx.fillRect(PAD, y, x2 - PAD, CELL);
  } else if (car.exit === 'U') {
    const x  = c2p(car.col);
    const y2 = c2p(car.row);
    ctx.fillRect(x, PAD, CELL, y2 - PAD);
  } else { // D
    const x  = c2p(car.col);
    const y1 = c2p(car.row + car.len);
    ctx.fillRect(x, y1, CELL, SIZE - PAD - y1);
  }
}

function draw() {
  ctx.clearRect(0, 0, SIZE, SIZE);

  // Board bg
  ctx.fillStyle = '#12192b';
  rr(0, 0, SIZE, SIZE, 14); ctx.fill();

  // Grid cells
  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      ctx.fillStyle = '#1a2540';
      rr(c2p(c), c2p(r), CELL, CELL, 6); ctx.fill();
    }
  }

  // Subtle grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let i = 1; i < GRID; i++) {
    ctx.beginPath(); ctx.moveTo(c2p(i), PAD); ctx.lineTo(c2p(i), SIZE-PAD); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PAD, c2p(i)); ctx.lineTo(SIZE-PAD, c2p(i)); ctx.stroke();
  }

  // Exit lane glows
  for (const car of cars) drawExitGlow(car);

  const dragId = dragging ? dragging.car.id : -1;
  const escId  = escapingCar ? escapingCar.id : -1;

  // Draw non-dragging, non-escaping, non-escaped cars
  for (const car of cars) {
    if (car.escaped || car.id === dragId || car.id === escId) continue;
    drawCarAt(car, 0, 0);
  }

  // Escaping car animation
  if (escapingCar) {
    const t = escapeProgress;
    const dist = CELL * 7;
    let ex = 0, ey = 0;
    if (escapingCar.exit === 'R') ex =  t * dist;
    if (escapingCar.exit === 'L') ex = -t * dist;
    if (escapingCar.exit === 'D') ey =  t * dist;
    if (escapingCar.exit === 'U') ey = -t * dist;
    ctx.save();
    ctx.globalAlpha = 1 - t * 0.6;
    drawCarAt(escapingCar, ex, ey);
    ctx.restore();
  }

  // Dragged car on top
  if (dragging) drawCarAt(dragging.car, 0, 0);
}

// --- Check if car reached its exit ---
function checkEscape() {
  for (const car of cars) {
    if (car.escaped) continue;
    let atExit = false;
    if (car.exit === 'R' && car.col === GRID - car.len) atExit = true;
    if (car.exit === 'L' && car.col === 0)              atExit = true;
    if (car.exit === 'U' && car.row === 0)              atExit = true;
    if (car.exit === 'D' && car.row === GRID - car.len) atExit = true;
    if (atExit) {
      animateEscape(car);
      return;
    }
  }
}

function animateEscape(car) {
  escapingCar = car;
  escapeProgress = 0;
  const duration = 500;
  const start = performance.now();

  function step(now) {
    escapeProgress = Math.min((now - start) / duration, 1);
    if (escapeProgress < 1) {
      requestAnimationFrame(step);
    } else {
      car.escaped = true;
      // Mark exit marker as done
      const marker = document.getElementById(`exit-${car.id}`);
      if (marker) marker.style.opacity = '0.25';
      escapingCar = null;
      updateHUD();
      // Check win
      if (cars.every(c => c.escaped)) {
        setTimeout(() => {
          const isLast = levelIdx + 1 >= LEVELS.length;
          showOverlay('🎉 Level Clear!', `All cars escaped in ${moves} moves!`, isLast ? 'Play Again 🔄' : 'Next Level ›');
        }, 200);
      } else {
        // Check another car can escape
        checkEscape();
      }
    }
  }
  requestAnimationFrame(step);
}

// --- Input Handling ---
function getXY(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = SIZE / rect.width, sy = SIZE / rect.height;
  const s = e.touches ? e.touches[0] : e;
  return { x:(s.clientX-rect.left)*sx, y:(s.clientY-rect.top)*sy };
}

function carAtPx(px, py) {
  const c = Math.floor(p2c(px));
  const r = Math.floor(p2c(py));
  if (c<0||c>=GRID||r<0||r>=GRID) return null;
  return cars.find(car => occupies(car, r, c)) || null;
}

canvas.addEventListener('mousedown',  onDown);
canvas.addEventListener('touchstart', onDown, {passive:false});
canvas.addEventListener('mousemove',  onMove);
canvas.addEventListener('touchmove',  onMove, {passive:false});
window.addEventListener('mouseup',    onUp);
window.addEventListener('touchend',   onUp);

function onDown(e) {
  e.preventDefault();
  if (escapingCar) return;
  const {x, y} = getXY(e);
  const car = carAtPx(x, y);
  if (!car) return;
  dragging = { car, sx:x, sy:y, sc:car.col, sr:car.row };
}

function onMove(e) {
  e.preventDefault();
  if (!dragging) return;
  const {x, y} = getXY(e);
  const car = dragging.car;
  if (car.dir === 'H') {
    const tgt = Math.round(dragging.sc + (x - dragging.sx) / (CELL+GAP));
    const clamped = Math.max(0, Math.min(GRID-car.len, tgt));
    car.col = slideMax(car, clamped);
  } else {
    const tgt = Math.round(dragging.sr + (y - dragging.sy) / (CELL+GAP));
    const clamped = Math.max(0, Math.min(GRID-car.len, tgt));
    car.row = slideMax(car, clamped);
  }
}

function onUp() {
  if (!dragging) return;
  const car = dragging.car;
  if (car.col !== dragging.sc || car.row !== dragging.sr) {
    moves++;
    updateHUD();
    checkEscape();
  }
  dragging = null;
}

// --- Overlay / Messages ---
function showOverlay(title, body, btn) {
  document.getElementById('msg-title').textContent = title;
  document.getElementById('msg-body').textContent  = body;
  document.getElementById('msg-btn').textContent   = btn;
  document.getElementById('msg-overlay').classList.add('show');
}
function onMsgBtn() {
  document.getElementById('msg-overlay').classList.remove('show');
  const next = (levelIdx + 1 < LEVELS.length) ? levelIdx + 1 : 0;
  loadLevel(next);
}
function resetLevel() { loadLevel(levelIdx); }
function skipLevel()  { loadLevel((levelIdx+1) % LEVELS.length); }

// --- Main Game Loop ---
function loop() { draw(); requestAnimationFrame(loop); }

loadLevel(0);
loop();
</script>
